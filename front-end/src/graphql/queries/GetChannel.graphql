query GetChannel($id: Int64!) {
  getChannel(id: $id) {
    id
    name
    description
    bannerImageUrl
    thumbnailUrl
    createdAt
    posts {
      ...PostFields
    }
    totalPosts
    owner {
      id
      username
      fullName
      profileImageUrl
      anonymous
    }
    isMember
    isFollower
    isPending
    isOwner
    isPrivate
    canModerate
    community {
      id
      name
      slug
    }
    membersCount
    followersCount
    minAge
    theme
    ownTheme
    coverPattern
  }
}

