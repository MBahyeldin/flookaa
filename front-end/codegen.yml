schema: "../shared/external/graph/*.graphqls"
documents: "src/graphql/**/*.graphql"
generates:
  src/generated/graphql.ts:
    plugins:
      - "typescript"
      - "typescript-operations"
      - "typed-document-node"
    config:
      enumsAsTypes: true
      useTypeImports: true
      documentNodeImport: "@apollo/client#TypedDocumentNode"
      scalars:
        ID: string
        UUID: string
        DateTime: string
