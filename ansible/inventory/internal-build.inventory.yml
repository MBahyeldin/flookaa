all:
  hosts:
    internal_build:
      ip: "{{ containers.internal_build.ip }}"
      ansible_host: "{{ ansible_host_machine.ansible_host }}"
      lxc_container: "internal-build"
      ansible_connection: lxc_ssh
      ansible_ssh_private_key_file: ~/ssh-keys/lxd_dev.pem
      ansible_user: ubuntu
      ansible_python_interpreter: /usr/bin/python3
      ansible_become: true
      ansible_become_method: su


  vars:
    container_user: "devBuilder"
    container_ssh_key: "./files/ssh-key.pem"
    build_user: "{{ container_user }}"
    build_group: "{{ container_user }}"
    build_home: "/home/{{ build_user }}"
    build_shell: "/bin/bash"
    build_workspace: "{{ build_home }}/workspace"

    # Go is installed from upstream, not apt: Ubuntu 24.04 ships Go 1.22 and
    # go.work requires go >= 1.26.0 (whatsmeow's minimum). Bump the version and
    # the matching checksum together — they are published at
    # https://go.dev/dl/?mode=json
    golang_version: "1.26.0"
    golang_arch: "amd64"
    golang_sha256:
      amd64: "aac1b08a0fb0c4e0a7c1555beb7b59180b05dfc5a3d62e40e9de90cd42f88235"
      arm64: "bd03b743eb6eb4193ea3c3fd3956546bf0e3ca5b7076c8226334afe6b75704cd"



